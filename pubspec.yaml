name: language_coach
description: A multilingual AI language coach.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking (P0-2 will use; declared early so P0-1 interfaces can sit on it)
  dio: ^5.7.0

  # State management (P0-4 migration target)
  flutter_riverpod: ^2.5.1

  # Immutable models + JSON (declared now so P0-1 can wire serialization)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local persistence (P0-3 will use)
  path: ^1.9.0
  path_provider: ^2.1.4
  sqflite: ^2.3.3

  # Secure storage for API keys (P0-2)
  flutter_secure_storage: ^9.2.2

  # Stable message identifiers
  uuid: ^4.5.1

  # Audio playback (P1-1 wiring — Android ExoPlayer-backed)
  just_audio: ^0.9.42

  # SHA-256 verification of downloaded model artifacts (P1-5)
  crypto: ^3.0.5

  # System share menu for history export (P2-2)
  share_plus: ^10.1.2
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation for freezed + json_serializable
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # SQLite in host-VM tests (audio cache, schema migration)
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true